<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>Keuangan Keluarga</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#1a120d;--mute:#7b6857;--line:rgba(60,38,24,.13);--accent:#6b4228;--ai:#fff;--inc:#a2763f;--exp:#2a1b13;--over:#c2492c;--track:#ece2d5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0908;--card:#15100d;--ink:#f4ece3;--mute:#9a8878;--line:rgba(214,170,125,.16);--accent:#d6aa7d;--ai:#140d09;--inc:#e9d3b0;--exp:#b4764a;--over:#e0795a;--track:#241a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0908;--card:#15100d;--ink:#f4ece3;--mute:#9a8878;--line:rgba(214,170,125,.16);--accent:#d6aa7d;--ai:#140d09;--inc:#e9d3b0;--exp:#b4764a;--over:#e0795a;--track:#241a14}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;max-width:520px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}.i{flex:none}
h1{font-size:18px;font-weight:600;letter-spacing:.2px}h2{font-size:13.5px;font-weight:600;margin-bottom:12px}h3{font-size:18px;font-weight:600}
small,.mut{color:var(--mute);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top div{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.mon{display:flex;align-items:center;width:max-content;border:1px solid var(--line);border-radius:999px;margin-bottom:14px}
.mon button{width:36px;height:34px;border:0;background:none;font-size:20px}.mon span{min-width:120px;text-align:center;font-size:13px}
.hero{display:grid;grid-template-columns:1fr 84px;gap:6px 12px;align-items:center;color:#f4ece3;border-radius:30px;padding:22px 20px;margin-bottom:12px;border:1px solid rgba(214,170,125,.28);background:radial-gradient(circle at 90% 0,rgba(214,170,125,.3),transparent 55%),linear-gradient(150deg,#2e1e14,#0d0907)}
.hero small{color:#bfa58a}.big{font-size:32px;font-weight:300;letter-spacing:-1px;line-height:1.2}
.two{grid-column:1/-1;display:flex;gap:10px;margin-top:10px}.two div{flex:1;border:1px solid rgba(214,170,125,.2);background:rgba(214,170,125,.08);border-radius:16px;padding:10px 12px}.two b{display:block;font-weight:400;font-size:14px}
.ring circle{fill:none;stroke-width:7}.rt{stroke:rgba(214,170,125,.18)}.rg{stroke:#d6aa7d;stroke-linecap:round}.ring text{fill:#f4ece3;font-size:15px;font-weight:300}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.empty{text-align:center;color:var(--mute);padding:28px 16px}
.rw{display:flex;justify-content:space-between;gap:10px;align-items:center}.rw span{display:flex;gap:8px;align-items:center}
.cr{margin-bottom:14px}.cr:last-child{margin-bottom:0}
.bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}.bar i.w{background:var(--exp)}.bar i.o{background:var(--over)}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mute);font-size:10px;font-family:inherit}
.bi{fill:var(--inc);background:var(--inc)}.be{fill:var(--exp);background:var(--exp)}
.lg{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mute);margin-top:8px}.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}.lg i+i{margin-left:10px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl div{border:1px solid var(--line);border-radius:14px;padding:11px 12px}.tl b{display:block;font-weight:600;font-size:14px;margin-top:2px}
.note{margin-top:12px;color:var(--mute);font-size:12.5px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm i{aspect-ratio:1;border-radius:9px;font:10px Sora,sans-serif;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) var(--o,0%),var(--track));color:var(--mute)}.hm i.e{background:none}
.dl{font-size:11.5px;color:var(--mute);padding:12px 0 2px}.dl:first-child{padding-top:0}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.it:last-child{border-bottom:0}.it.col{flex-direction:column;align-items:stretch;gap:2px}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--track);color:var(--accent);display:grid;place-items:center;flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600}.mid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{font-weight:600}.inc{color:var(--inc)}.exp{color:var(--ink)}.over{color:var(--over)}
.big2{font-size:26px;font-weight:300;margin-top:8px;letter-spacing:-.5px}
.lnk{background:none;border:0;color:var(--accent);font-size:13px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:6px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:10.5px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.on{color:var(--accent)}
nav .plus{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--ai);justify-content:center;margin:0 6px}
#sh{position:fixed;inset:0;display:none;z-index:20}#sh.open{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
textarea{font-size:12px;height:80px;resize:none}input.err,textarea.err{border-color:var(--over)}input.amt{font-size:24px;font-weight:300}
.seg{display:flex;background:var(--track);border-radius:14px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:12.5px}.chip.on{background:var(--accent);color:var(--ai);border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:18px}.row+.row{margin-top:10px}
.btn{flex:1;border:0;background:var(--accent);color:var(--ai);font-weight:600;padding:13px;border-radius:15px;width:100%}
.btn.out{background:none;border:1px solid var(--accent);color:var(--accent)}.btn.dng{background:var(--over);color:#fff}
</style>
</head>
<body>
<div class="top"><h1>Keuangan Keluarga</h1><div><button class="ib" id="eye" data-a="hide" aria-label="Sembunyikan saldo"></button><button class="ib" data-a="set" aria-label="Pengaturan"></button></div></div>
<div class="mon" id="mon"><button data-a="prev" aria-label="Bulan sebelumnya">‹</button><span id="mname"></span><button data-a="next" aria-label="Bulan berikutnya">›</button></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sh"></div>
<script>
const P={food:'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 8h3',car:'M5 16v-5l2-5h10l2 5v5M3 16h18M7.5 19v-3M16.5 19v-3',bolt:'M13 2 4 14h7l-1 8 9-12h-7z',bag:'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',heart:'M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z',book:'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',spark:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',dots:'M5 12.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM12 12.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM19 12.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z',wallet:'M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1zM4 7V6a2 2 0 0 1 2-2h10M16 13.5h.01',store:'M4 9l1-5h14l1 5M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0M5 11v9h14v-9',gift:'M4 9h16v4H4zM6 13v8h12v-8M12 9v12M12 9C9 9 8 5.5 10 5s2 4 2 4zM12 9c3 0 4-3.5 2-4s-2 4-2 4z',coin:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8.5 12h7',grid:'M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',target:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',flag:'M5 21V4M5 4h11l-2 4 2 4H5',plus:'M12 5v14M5 12h14',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',eyeoff:'M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.6M6.5 6.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 4-.9',sl:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4'};
const I=(k,s=20)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
const CE=[['Makanan','food'],['Transportasi','car'],['Tagihan','bolt'],['Belanja','bag'],['Kesehatan','heart'],['Pendidikan','book'],['Hiburan','spark'],['Lainnya','dots']];
const CI=[['Gaji','wallet'],['Usaha','store'],['Bonus','gift'],['Lainnya','coin']];
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=s=>document.querySelector(s);
const ico=(t,c)=>((t==='inc'?CI:CE).find(x=>x[0]===c)||['','dots'])[1];
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const fmt=n=>n?(+n).toLocaleString('id-ID'):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ym=s=>s.slice(0,7),pad=n=>String(n).padStart(2,'0');
const fd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fd(new Date());
const shift=(m,k)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const num=s=>+($(s).value.replace(/\D/g,'')||0);
const bad=s=>{$(s).classList.add('err');$(s).focus()};
let S={tx:[],bud:{},goals:[],hide:0,theme:'dark'},tab='home',cur=ym(today()),F={},Q='';
try{const r=localStorage.getItem('kk1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('kk1',JSON.stringify(S))}catch(e){}};
const th=()=>document.documentElement.dataset.theme=S.theme||'dark';
const M=n=>S.hide?'Rp •••••':rp(n);
const sum=m=>{let inc=0,exp=0;S.tx.forEach(t=>{if(ym(t.date)===m)t.type==='inc'?inc+=t.amt:exp+=t.amt});return{inc,exp}};
const spent=(c,m)=>S.tx.reduce((a,t)=>a+(t.type==='exp'&&t.cat===c&&ym(t.date)===m?t.amt:0),0);
const dl=d=>d===today()?'Hari ini':(+d.slice(8))+' '+MON[+d.slice(5,7)-1].slice(0,3);
function streak(){const ds=new Set(S.tx.map(t=>t.date)),d=new Date();let n=0;if(!ds.has(fd(d)))d.setDate(d.getDate()-1);while(ds.has(fd(d))){n++;d.setDate(d.getDate()-1)}return n}

function vHome(){
 const {inc,exp}=sum(cur),ds=[];
 for(let i=5;i>=0;i--){const m=shift(cur,-i);ds.push({m,...sum(m)})}
 const mx=Math.max(1,...ds.flatMap(d=>[d.inc,d.exp])),any=ds.some(d=>d.inc||d.exp);
 let svg='';
 ds.forEach((d,i)=>{const x=i*53+8,a=d.inc/mx*100,b=d.exp/mx*100;
  svg+=`<rect class="bi" x="${x}" y="${115-a}" width="16" height="${a}" rx="8"/><rect class="be" x="${x+19}" y="${115-b}" width="16" height="${b}" rx="8"/><text x="${x+17}" y="134" text-anchor="middle">${MON[+d.m.slice(5)-1].slice(0,3)}</text>`});
 const y=+cur.slice(0,4),mo=+cur.slice(5),dim=new Date(y,mo,0).getDate(),now=cur===ym(today()),el=now?+today().slice(8):dim;
 const dt=Array(dim).fill(0);S.tx.forEach(t=>{if(t.type==='exp'&&ym(t.date)===cur)dt[+t.date.slice(8)-1]+=t.amt});
 const mxd=Math.max(...dt),worst=mxd?dt.indexOf(mxd)+1:0,avg=exp/el,pv=sum(shift(cur,-1)).exp;
 const pct=inc?Math.min(100,exp/inc*100):exp?100:0,C=2*Math.PI*34;
 const tiles=[['Rata-rata keluar per hari',rp(avg)],[now?'Proyeksi akhir bulan':'Total bulan ini',rp(now?avg*dim:exp)],['Hari terboros',worst?worst+' '+MON[mo-1].slice(0,3):'-'],['Beruntun mencatat',streak()+' hari']];
 let hm='<i class="e"></i>'.repeat((new Date(y,mo-1,1).getDay()+6)%7);
 dt.forEach((v,i)=>hm+=`<i style="--o:${mxd?Math.round(v/mxd*85):0}%">${i+1}</i>`);
 const cats=CE.map(([c,k])=>({c,k,v:spent(c,cur)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 return `<div class="hero"><div><small>Sisa uang bulan ini</small><div class="big">${M(inc-exp)}</div></div><svg class="ring" viewBox="0 0 84 84"><circle class="rt" cx="42" cy="42" r="34"/><circle class="rg" cx="42" cy="42" r="34" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle">${Math.round(pct)}%</text></svg><div class="two"><div><small>Pemasukan</small><b>${M(inc)}</b></div><div><small>Pengeluaran</small><b>${M(exp)}</b></div></div></div>`
 +`<div class="card"><h2>Wawasan bulan ini</h2><div class="tl">${tiles.map(t=>`<div><small>${t[0]}</small><b>${t[1]}</b></div>`).join('')}</div>`+(pv&&exp?`<p class="note">Pengeluaran ${exp>=pv?'naik':'turun'} ${Math.abs(Math.round((exp-pv)/pv*100))}% dibanding bulan lalu.</p>`:'')+`</div>`
 +(any?`<div class="card"><h2>Laporan 6 bulan terakhir</h2><svg class="ch" viewBox="0 0 320 140">${svg}</svg><div class="lg"><i class="bi"></i>Masuk<i class="be"></i>Keluar</div></div>`:`<div class="card empty">Belum ada catatan. Tekan tombol + untuk mencatat transaksi pertama.</div>`)
 +`<div class="card"><h2>Peta pengeluaran harian</h2><div class="hm">${hm}</div></div>`
 +`<div class="card"><h2>Pengeluaran per kategori</h2>`+(cats.length?cats.map(x=>`<div class="cr"><div class="rw"><span>${I(x.k,18)}${x.c}</span><b>${rp(x.v)} (${Math.round(x.v/exp*100)}%)</b></div><div class="bar"><i style="width:${x.v/exp*100}%"></i></div></div>`).join(''):'<p class="mut">Belum ada pengeluaran bulan ini.</p>')+'</div>';
}
function txList(){
 const q=Q.toLowerCase(),l=S.tx.filter(t=>ym(t.date)===cur&&(!q||(t.cat+' '+t.note).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 if(!l.length)return '<div class="card empty">Tidak ada transaksi yang cocok.</div>';
 let h='',d='';
 l.forEach(t=>{if(t.date!==d){d=t.date;h+=`<div class="dl">${dl(d)}</div>`}
  h+=`<button class="it" data-a="edit" data-id="${t.id}"><span class="ic">${I(ico(t.type,t.cat))}</span><span class="mid"><b>${t.cat}</b><small>${esc(t.note)}</small></span><span class="ai ${t.type}">${t.type==='inc'?'+':'-'}${rp(t.amt)}</span></button>`});
 return '<div class="card">'+h+'</div>';
}
const vTx=()=>`<input id="q" type="search" placeholder="Cari transaksi atau catatan" value="${esc(Q)}" style="margin-bottom:12px"><div id="lst">${txList()}</div>`;
function vBud(){
 let tl=0,ts=0;
 const cl=p=>p>100?'o':p>80?'w':'';
 const rows=CE.map(([c,k])=>{const l=S.bud[c]||0,s=spent(c,cur),p=l?s/l*100:0;tl+=l;ts+=s;
  return `<button class="it col" data-a="bud" data-v="${c}"><div class="rw"><span>${I(k,18)}${c}</span><b>${rp(s)}${l?' dari '+rp(l):''}</b></div>`+(l?`<div class="bar"><i class="${cl(p)}" style="width:${Math.min(p,100)}%"></i></div><small class="${p>100?'over':''}">${p>100?'Melebihi '+rp(s-l):'Sisa '+rp(l-s)}</small>`:'<small>Ketuk untuk atur anggaran</small>')+'</button>'}).join('');
 const p=tl?ts/tl*100:0;
 return `<div class="card"><h2>Total anggaran bulan ini</h2><div class="rw"><span class="mut">Terpakai</span><b>${rp(ts)}${tl?' dari '+rp(tl):''}</b></div>`+(tl?`<div class="bar"><i class="${cl(p)}" style="width:${Math.min(p,100)}%"></i></div>`:'')+`</div><div class="card">${rows}</div>`;
}
function vGoal(){
 const g=S.goals.map(x=>{const p=Math.min(100,x.saved/x.target*100);
  return `<div class="card"><div class="rw"><b>${I('flag',18)} ${esc(x.name)}</b><button class="lnk" data-a="goal" data-id="${x.id}">Ubah</button></div><div class="big2">${rp(x.saved)}</div><small>${p>=100?'Target tercapai':'Dari target '+rp(x.target)+', '+Math.round(p)+'%'}</small><div class="bar" style="margin:10px 0 14px"><i style="width:${p}%"></i></div><button class="btn out" data-a="dep" data-id="${x.id}">Setor atau tarik</button></div>`}).join('');
 return (g||'<div class="card empty">Belum ada target tabungan. Buat satu, misalnya dana darurat atau liburan.</div>')+'<button class="btn" data-a="goal">Tambah target baru</button>';
}
function render(){
 $('#mon').style.display=tab==='goal'?'none':'flex';
 $('#mname').textContent=MON[+cur.slice(5)-1]+' '+cur.slice(0,4);
 $('#eye').innerHTML=I(S.hide?'eyeoff':'eye',18);$('#eye').nextElementSibling.innerHTML=I('sl',18);
 $('#main').innerHTML={home:vHome,tx:vTx,bud:vBud,goal:vGoal}[tab]();
 const nb=(v,k,t)=>`<button data-a="tab" data-v="${v}" class="${tab===v?'on':''}">${I(k,21)}${t}</button>`;
 $('#nav').innerHTML=nb('home','grid','Ringkasan')+nb('tx','list','Transaksi')+`<button class="plus" data-a="add" aria-label="Catat transaksi">${I('plus',26)}</button>`+nb('bud','target','Anggaran')+nb('goal','flag','Tabungan');
}
function sheet(h){$('#sh').innerHTML='<div class="bk" data-a="close"></div><div class="pn">'+h+'</div>';$('#sh').classList.add('open')}
function closeSheet(){$('#sh').classList.remove('open');$('#sh').innerHTML=''}
const chips=()=>(F.type==='exp'?CE:CI).map(([c,k])=>`<button class="chip ${c===F.cat?'on':''}" data-a="cat" data-v="${c}">${I(k,16)}${c}</button>`).join('');
function txForm(id){
 const t=id?S.tx.find(x=>x.id===id):{type:'exp',amt:0,cat:'Makanan',date:today(),note:''};
 F={id,type:t.type,cat:t.cat};
 sheet(`<h3>${id?'Ubah transaksi':'Catat transaksi'}</h3><div class="seg"><button data-a="type" data-v="exp" class="${t.type==='exp'?'on':''}">Pengeluaran</button><button data-a="type" data-v="inc" class="${t.type==='inc'?'on':''}">Pemasukan</button></div>
 <label>Jumlah (Rp)</label><input id="f-amt" class="amt" inputmode="numeric" placeholder="0" value="${fmt(t.amt)}">
 <label>Kategori</label><div class="chips" id="f-cats">${chips()}</div>
 <label>Tanggal</label><input id="f-date" type="date" value="${t.date}">
 <label>Catatan</label><input id="f-note" maxlength="60" placeholder="Opsional" value="${esc(t.note)}">
 <div class="row"><button class="btn" data-a="save-tx">Simpan</button>${id?'<button class="btn dng" data-a="del-tx">Hapus</button>':''}</div>`);
}
function dep(s){const a=num('#f-d');if(!a)return bad('#f-d');const g=S.goals.find(x=>x.id===F.id);g.saved=Math.max(0,g.saved+s*a);save();closeSheet();render()}
document.addEventListener('input',e=>{const t=e.target;t.classList.remove('err');
 if(t.id==='q'){Q=t.value;$('#lst').innerHTML=txList()}
 if(t.classList.contains('amt')){const v=t.value.replace(/\D/g,'').slice(0,12);t.value=v?(+v).toLocaleString('id-ID'):''}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const v=b.dataset.v,id=b.dataset.id;
 const arm=fn=>{if(!F.arm){F.arm=1;b.textContent='Yakin hapus?';return}fn();save();closeSheet();render()};
 const A={
  tab:()=>{tab=v;render();scrollTo(0,0)},
  prev:()=>{cur=shift(cur,-1);render()},next:()=>{cur=shift(cur,1);render()},
  hide:()=>{S.hide=S.hide?0:1;save();render()},
  close:closeSheet,add:()=>txForm(),edit:()=>txForm(id),
  type:()=>{F.type=v;F.cat=(v==='exp'?CE:CI)[0][0];document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#f-cats').innerHTML=chips()},
  cat:()=>{F.cat=v;$('#f-cats').innerHTML=chips()},
  'save-tx':()=>{const amt=num('#f-amt'),date=$('#f-date').value;if(!amt)return bad('#f-amt');if(!date)return bad('#f-date');
   const o={id:F.id||uid(),type:F.type,cat:F.cat,amt,date,note:$('#f-note').value.trim()};
   const i=S.tx.findIndex(t=>t.id===o.id);i<0?S.tx.push(o):S.tx[i]=o;cur=ym(date);save();closeSheet();render()},
  'del-tx':()=>arm(()=>{S.tx=S.tx.filter(t=>t.id!==F.id)}),
  bud:()=>{F={c:v};sheet(`<h3>Anggaran ${v}</h3><label>Batas pengeluaran per bulan (Rp). Isi 0 untuk menghapus.</label><input id="f-b" class="amt" inputmode="numeric" placeholder="0" value="${fmt(S.bud[v])}"><div class="row"><button class="btn" data-a="save-bud">Simpan</button></div>`)},
  'save-bud':()=>{const n=num('#f-b');n?S.bud[F.c]=n:delete S.bud[F.c];save();closeSheet();render()},
  goal:()=>{const g=S.goals.find(x=>x.id===id);F={id};sheet(`<h3>${g?'Ubah target':'Target tabungan baru'}</h3><label>Nama target</label><input id="f-n" maxlength="40" placeholder="Contoh: Dana darurat" value="${g?esc(g.name):''}"><label>Jumlah target (Rp)</label><input id="f-t" class="amt" inputmode="numeric" placeholder="0" value="${g?fmt(g.target):''}"><div class="row"><button class="btn" data-a="save-goal">Simpan</button>${g?'<button class="btn dng" data-a="del-goal">Hapus</button>':''}</div>`)},
  'save-goal':()=>{const n=$('#f-n').value.trim(),t=num('#f-t');if(!n)return bad('#f-n');if(!t)return bad('#f-t');
   const g=S.goals.find(x=>x.id===F.id);g?(g.name=n,g.target=t):S.goals.push({id:uid(),name:n,target:t,saved:0});save();closeSheet();render()},
  'del-goal':()=>arm(()=>{S.goals=S.goals.filter(x=>x.id!==F.id)}),
  dep:()=>{const g=S.goals.find(x=>x.id===id);F={id};sheet(`<h3>${esc(g.name)}</h3><small>Terkumpul ${rp(g.saved)} dari ${rp(g.target)}</small><label>Jumlah (Rp)</label><input id="f-d" class="amt" inputmode="numeric" placeholder="0"><div class="row"><button class="btn" data-a="dep-in">Setor</button><button class="btn out" data-a="dep-out">Tarik</button></div>`)},
  'dep-in':()=>dep(1),'dep-out':()=>dep(-1),
  set:()=>{F={};sheet(`<h3>Pengaturan</h3><div class="seg"><button data-a="theme" data-v="dark" class="${S.theme!=='light'?'on':''}">Mode gelap</button><button data-a="theme" data-v="light" class="${S.theme==='light'?'on':''}">Mode terang</button></div><label>Cadangan data. Salin teks ini dan simpan di tempat aman.</label><textarea id="f-bk" readonly>${esc(JSON.stringify(S))}</textarea><label>Pulihkan dari cadangan. Tempel teks cadangan di sini.</label><textarea id="f-rs"></textarea><div class="row"><button class="btn" data-a="restore">Pulihkan data</button></div><div class="row"><button class="btn dng" data-a="reset">Hapus semua data</button></div>`)},
  theme:()=>{S.theme=v;save();th();document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.v===v))},
  restore:()=>{try{const o=JSON.parse($('#f-rs').value);if(!Array.isArray(o.tx))throw 0;S=Object.assign({tx:[],bud:{},goals:[],hide:0,theme:'dark'},o);save();th();closeSheet();render()}catch(x){bad('#f-rs')}},
  reset:()=>arm(()=>{S={tx:[],bud:{},goals:[],hide:S.hide,theme:S.theme}})
 };
 A[b.dataset.a]&&A[b.dataset.a]();
});
th();render();
</script>
</body>
</html>
