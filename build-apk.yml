name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir www assets && cp index.html www/ && cp icon-*.png splash*.png assets/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0908' --iconBackgroundColorDark '#0b0908' --splashBackgroundColor '#0b0908' --splashBackgroundColorDark '#0b0908'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keuangan-keluarga-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
